version = 1

[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  ".github/workflows/**",
  "portable_cube_harness/**",
  "tests/**/*.py",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 ColorLUThier contributors <https://github.com/loomitz/ColorLUThier>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
  "AGENTS.md",
  "CONTEXT.md",
  "CONTRIBUTING.md",
  "LICENSING.md",
  "docs/**",
  "tests/fixtures/**/DERIVATION.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 ColorLUThier contributors <https://github.com/loomitz/ColorLUThier>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "tests/fixtures/**/*.cube",
  "tests/fixtures/**/*.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 ColorLUThier contributors <https://github.com/loomitz/ColorLUThier>"
SPDX-License-Identifier = "CC0-1.0"
