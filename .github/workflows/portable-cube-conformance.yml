name: Portable Cube conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run acceptance suite
        run: python -m unittest discover -s tests -v

      - name: Collect native provisional headless engine evidence
        run: python -B -m headless_engine_evidence collect --output-dir "${{ runner.temp }}/headless-engine-evidence"

      - name: Repeat native collection in a fresh directory
        run: python -B -m headless_engine_evidence collect --output-dir "${{ runner.temp }}/headless-engine-evidence-repeat"

      - name: Require byte-identical deterministic evidence
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          first = (root / "headless-engine-evidence" / "deterministic.json").read_bytes()
          second = (root / "headless-engine-evidence-repeat" / "deterministic.json").read_bytes()
          if not first or first != second:
              raise SystemExit("HEADLESS_EVIDENCE_REPEAT_MISMATCH")

      - name: Upload native provisional headless engine evidence
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headless-engine-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/headless-engine-evidence/evidence.json
            ${{ runner.temp }}/headless-engine-evidence/deterministic.json
          if-no-files-found: error
          retention-days: 30

  compare-headless-evidence:
    name: Compare native provisional headless engine evidence
    needs: acceptance
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download native evidence without merging platform directories
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: headless-engine-evidence-*
          path: ${{ runner.temp }}/headless-engine-evidence-platforms
          merge-multiple: false

      - name: Require all three platforms and compare contractual evidence
        run: python -B -m headless_engine_evidence compare --artifacts-dir "${{ runner.temp }}/headless-engine-evidence-platforms"
